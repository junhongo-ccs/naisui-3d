<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>naisui-3d 内水浸水 3D ビューア</title>
	</head>
	<body>
		<aside id="panel">
			<button id="panel-toggle" type="button" aria-label="パネルを開閉">☰</button>
			<div class="panel-body">
				<h1>内水浸水 3D</h1>
				<p id="title" class="sub"></p>

				<label class="field">市町村
					<select id="city"></select>
				</label>

				<fieldset class="field">
					<legend>内水浸水想定区域</legend>
					<div id="floods"></div>
				</fieldset>

				<label class="field">浸水の不透明度
					<input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.8" />
				</label>

				<label class="field">背景地図
					<select id="base"></select>
				</label>

				<label class="check"><input id="show-buildings" type="checkbox" checked /> 建物を表示</label>

				<p class="hint">ドラッグ／1本指: 回転 ・ 右ドラッグ／2本指: 移動 ・ ホイール／ピンチ: ズーム ・ クリック／タップ: 浸水深を表示</p>
				<p class="hint">VR: 左スティックで移動、右スティック左右で向きを変える、上下で高さ、トリガーで加速</p>
			</div>
		</aside>

		<section id="legend" hidden>
			<h2>想定浸水深</h2>
			<ul id="legend-items"></ul>
		</section>

		<div id="info" hidden></div>

		<footer id="attribution">
			出典: <a href="https://www.mlit.go.jp/plateau/" target="_blank" rel="noopener">国土交通省 PLATEAU</a>
			／ <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>
		</footer>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
